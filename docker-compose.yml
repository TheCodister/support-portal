services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: supportdesk
      POSTGRES_USER: supportdesk
      POSTGRES_PASSWORD: supportdesk
    ports: ["55432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportdesk"]
      interval: 3s
      timeout: 3s
      retries: 20
  localstack:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: s3
      DEBUG: 0
    ports: ["4566:4566"]
    volumes:
      - ./docker/localstack:/etc/localstack/init/ready.d
volumes:
  postgres_data:
